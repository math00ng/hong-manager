<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sid:#1B3A2D;--sh:#24503D;--sa:#4CAF82;--top:#F0FAF4;--tb:#C8E6D4;
  --acc:#2D9B6A;--acc2:#227A53;--r:10px;--rs:6px;--font:system-ui,-apple-system,sans-serif
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:#EDF7F1;color:#1A3028;display:flex}
.app{display:flex;width:100%;height:100vh}
.sb{width:210px;background:var(--sid);display:flex;flex-direction:column;flex-shrink:0;z-index:50;transition:transform .25s}
.sb-hd{padding:14px 13px 11px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo{font-size:14px;font-weight:600;color:#fff}
.sb-sub{font-size:10px;color:rgba(255,255,255,.38);margin-top:2px}
.nb{width:100%;text-align:left;padding:8px 13px;font-size:13px;background:none;border:none;cursor:pointer;color:rgba(255,255,255,.55);border-left:3px solid transparent}
.nb:hover{background:var(--sh);color:#fff}
.nb.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--sa);font-weight:500}
.ns{padding:7px 13px 2px;font-size:10px;color:rgba(255,255,255,.28);letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;padding-right:10px}
.sl{flex:1;overflow-y:auto}
.si{padding:7px 13px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.5);border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si:hover{background:var(--sh);color:#fff}
.si.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--sa)}
.ab{margin:4px 9px;padding:7px;font-size:12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:var(--rs);cursor:pointer;color:rgba(255,255,255,.7);text-align:center}
.ab:hover{background:rgba(255,255,255,.17);color:#fff}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tp{background:var(--top);border-bottom:1px solid var(--tb);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px}
.tp-l{display:flex;align-items:center;gap:10px}
.tp-t{font-size:15px;font-weight:500;color:#1A3028}
.tp-a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ham{display:none;background:none;border:none;cursor:pointer;color:#2D5044;font-size:22px;padding:2px 6px;line-height:1}
.ct{flex:1;overflow-y:auto;padding:16px}
.btn{padding:6px 12px;font-size:12px;border:1px solid #B2D8C4;border-radius:var(--rs);background:#fff;cursor:pointer;color:#2D5044}
.btn:hover{background:#E8F5EE}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc2)}
.btn.d{color:#C0392B;border-color:#F5B7B1}
.btn.d:hover{background:#FDEDEC}
.btn.s{padding:3px 9px;font-size:11px}
.card{background:#fff;border:1px solid #D4EDE0;border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:11px;color:#5A8070;font-weight:500}
.fl input,.fl select,.fl textarea{padding:7px 10px;font-size:14px;border:1px solid #B2D8C4;border-radius:var(--rs);background:#fff;color:#1A3028;font-family:var(--font);-webkit-appearance:none}
.fl textarea{resize:vertical;min-height:52px}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:none;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F2FAF5;padding:7px 10px;text-align:left;font-weight:500;font-size:11px;color:#5A8070;border-bottom:1px solid #D4EDE0}
td{padding:7px 10px;border-bottom:1px solid #EAF5EE;color:#2D5044}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F5FCF7}
.lb{background:none;border:none;cursor:pointer;color:var(--acc);font-size:13px;padding:0;font-weight:500}

.td-x{background:none;border:none;cursor:pointer;color:#B2D8C4;font-size:14px;padding:0}

.cal-o{display:grid;grid-template-columns:1fr 265px;gap:12px;align-items:start}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cdow{text-align:center;font-size:10px;font-weight:500;color:#7A9E8E;padding:3px 0}
.cdow:first-child{color:#E74C3C}.cdow:last-child{color:#2980B9}
.cd{min-height:68px;background:#fff;border:1px solid #EAF5EE;border-radius:5px;padding:3px;cursor:pointer;overflow:hidden}
.cd:hover{background:#F5FCF7}
.cd.ot .cdn{color:#B2D8C4}

.cd.sl{background:#E0F5EB;border-color:#86D4A8}
.cdn{font-size:10px;font-weight:500;color:#2D5044;width:18px;height:18px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.cd-ev span{display:block;padding:1px 2px;border-radius:2px;margin-bottom:1px;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{background:#fff;border:1px solid #D4EDE0;border-radius:var(--r);padding:13px;position:sticky;top:0}
.cs-hd{font-size:13px;font-weight:500;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #EAF5EE;color:#1A3028}
.er{display:flex;gap:7px;align-items:flex-start;margin-bottom:7px}
.ed{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:3px}
.eb{flex:1;font-size:12px;color:#2D5044}

.pc{background:#E8FBF2;border:1px solid #A7E0C2;border-radius:var(--rs);padding:10px 12px;margin-top:7px}
.pr{display:flex;gap:6px;margin-bottom:3px}

.pv{color:#0D6B3A;font-weight:500;font-size:13px}

.fb-prev{background:#F5FCF7;border:1px solid #D4EDE0;border-radius:var(--rs);padding:13px;font-size:14px;line-height:1.9;color:#2D5044;white-space:pre-wrap;min-height:120px;margin-bottom:10px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}

@media(max-width:768px){
  .sb{position:fixed;left:0;top:0;height:100%;transform:translateX(-100%)}

  .ham{display:block}
  .cal-o{grid-template-columns:1fr}
  .cs{position:static}
  .g2{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr 1fr}
  .today-2col{grid-template-columns:1fr!important}
  .today-stu-grid{grid-template-columns:repeat(2,1fr)!important}
  .fb-grid{grid-template-columns:repeat(4,1fr)!important}
  /* 모바일 터치 개선 */
  .btn{padding:8px 14px;font-size:13px}

  .nb{padding:11px 13px;font-size:14px}
  .fl input,.fl select,.fl textarea{font-size:16px!important} /* iOS 줌 방지 */
  .tp{padding:10px 12px}
  .ct{padding:12px}

@media(max-width:500px){
  .today-stu-grid{grid-template-columns:1fr!important}

  @media(max-width:600px){.fb-grid{grid-template-columns:1fr!important}}
  .g3{grid-template-columns:1fr}
}

<script>
const DOW=['일','월','화','수','목','금','토'];
const TIME_OPTS=['4:00-6:00','6:00-8:00','8:00-10:00','4:30-6:30','6:30-8:30','8:30-10:30'];
const DAY_COMBOS=[
  {v:'1',l:'월'},{v:'2',l:'화'},{v:'3',l:'수'},{v:'4',l:'목'},{v:'5',l:'금'}
];
const ECOLS=['#7C3AED','#2563EB','#059669','#D97706','#DC2626','#0891B2','#BE185D'];
const TC={'신규상담':['#DFF0E8','#1B6B46'],'첫 등원':['#C8F0DA','#0D5C3A'],'월간상담':['#E0F5EB','#1B5E3B'],'학부모상담':['#FEF9E7','#7D5A00'],'기타':['#EEF5F1','#4A7060']};
const EXAM_SCHEDULE=[
  {school:'해강중',students:['박동훈','박승원','장현우','정서윤','이제민'],start:'2025-06-23',end:'2025-06-25',color:'#7C3AED'},
  {school:'해운대여중',students:['서유현'],start:'2025-07-01',end:'2025-07-01',color:'#059669'},
  {school:'동아중',students:['변재원'],start:'2025-06-30',end:'2025-07-02',color:'#D97706'},
  {school:'해강고',students:['정혜윤'],start:'2025-06-25',end:'2025-06-30',color:'#DC2626'},
  {school:'양운고',students:['김세은'],start:'2025-06-29',end:'2025-07-03',color:'#0891B2'},
];
const LEGACY={'mwf-1':{days:[1,3,5],time:'4:00-6:00'},'mwf-2':{days:[1,3,5],time:'6:00-8:00'},'mwf-3':{days:[1,3,5],time:'8:00-10:00'},'ttf-1':{days:[2,4],time:'4:30-6:30'},'ttf-2':{days:[2,4],time:'6:30-8:30'},'ttf-3':{days:[2,4],time:'8:30-10:30'}};

function ld(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ds(new Date());}
function addD(s,n){const d=ld(s);d.setDate(d.getDate()+n);return ds(d);}
function fmtD(s){const d=ld(s);return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';}
function fmtS(s){if(!s)return'-';const d=ld(s);return(d.getMonth()+1)+'/'+d.getDate();}
function fmtPhone(v){const d=v.replace(/\D/g,'');if(d.length===11)return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);if(d.length===10)return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);return v;}

function getScheds(s){
  if(s.schedules&&s.schedules.length)return s.schedules;
  const days=s.slotDays&&s.slotDays.length?s.slotDays.map(Number):(s.slotId&&LEGACY[s.slotId]?LEGACY[s.slotId].days:[]);
  const time=s.slotTime||(s.slotId&&LEGACY[s.slotId]?LEGACY[s.slotId].time:'');
  if(days.length||time)return[{days,time}];
  return[];
}
function getStuDays(s){return[...new Set(getScheds(s).flatMap(sc=>sc.days.map(Number)))];}
function getStuLabel(s){const scs=getScheds(s);if(!scs.length)return'-';return scs.map(sc=>{const ds2=sc.days.slice().sort((a,b)=>a-b).map(d=>DOW[d]).join('');return ds2+(sc.time?' '+sc.time:'');}).join(' / ');}
function stuHasDay(s,dow){return getStuDays(s).includes(+dow);}

// ── 매주 월요일 피드백 초기화 ──
function checkAndResetFeedback(){
  const _lastResetKey='_fb_reset_week';
  const _today=today();
  const _todayObj=ld(_today);
  const _weekNum=Math.floor((_todayObj.getTime()-new Date(_todayObj.getFullYear(),0,1).getTime())/(7*24*60*60*1000));
  const _lastReset=localStorage.getItem(_lastResetKey);
  
  // 이번 주가 리셋되지 않았으면 리셋
  if(_lastReset!==String(_weekNum)){
    students.forEach(s=>{
      s.feedbackHistory=(s.feedbackHistory||[]).filter(f=>f.date<_today);
      s.fbNotes={};
    });
    localStorage.setItem(_lastResetKey,String(_weekNum));
    saveData();
  }
}

  function _fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  const _wkDates_={};
  for(let i=1;i<=5;i++){
    const _d=new Date(_today);
    _d.setDate(_today.getDate()+(i-_curDow)+(_wkOff*7));
    _wkDates_[i]=_fmtDate(_d);
  }

  const dayMap={1:[],2:[],3:[],4:[],5:[]};
  students.filter(s=>s.active!==false).forEach(s=>{
    [1,2,3,4,5].forEach(d=>{
      const dateStr=_wkDates_[d];
      if((s.skipDates||[]).includes(dateStr))return;

/* ═══ 주간 시간표: 드래그 이동 / 클릭 추가 ═══ */
let _ttDragPayload=null;
function ttDragStart(ev,payload){
  _ttDragPayload=payload;
  try{ev.dataTransfer.setData('text/plain',payload);ev.dataTransfer.effectAllowed='move';}catch(e){}
}
function ttDragOver(ev){ev.preventDefault();try{ev.dataTransfer.dropEffect='move';}catch(e){}}
function ttDrop(ev,toDay,toTime,toDate){
  ev.preventDefault();
  let payload=_ttDragPayload;
  try{const dt=ev.dataTransfer.getData('text/plain');if(dt)payload=dt;}catch(e){}
  if(!payload)return;
  const parts=payload.split('|');
  const sid=+parts[0],fromDate=parts[1],exIdx=+parts[2];
  const s=gs(sid);if(!s)return;
  if(fromDate===toDate){_ttDragPayload=null;return;}
  if(exIdx>=0){
    if(!Array.isArray(s.extraDates))s.extraDates=[];
    if(s.extraDates[exIdx])s.extraDates[exIdx]={date:toDate,time:toTime};
  } else {
    if(!Array.isArray(s.skipDates))s.skipDates=[];
    if(!s.skipDates.includes(fromDate))s.skipDates.push(fromDate);
    if(!Array.isArray(s.extraDates))s.extraDates=[];
    s.extraDates.push({date:toDate,time:toTime});
  }
  saveData();T(s.name+' → '+fmtS(toDate)+(toTime?' '+toTime:'')+' 이동됨');
  _ttDragPayload=null;
  rHome();
}
function ttRemoveExtra(sid,exIdx){
  const s=gs(sid);if(!s||!Array.isArray(s.extraDates))return;
  if(!confirm(s.name+' 학생의 이 수업을 삭제할까요?'))return;
  s.extraDates.splice(exIdx,1);
  saveData();T('삭제됨');rHome();
}

/* 시간표에 직접 추가한(학생 배정 없어도 항상 보이는) 시간대 */
function getPinnedTimes(){
  try{
    const raw=localStorage.getItem('hak_pinned_times');
    if(raw===null){
      const def=['1:00-3:00'];
      localStorage.setItem('hak_pinned_times',JSON.stringify(def));
      return def;
    }
    const arr=JSON.parse(raw);
    return Array.isArray(arr)?arr:[];
  }catch(e){return[];}
}
function savePinnedTimes(arr){
  try{localStorage.setItem('hak_pinned_times',JSON.stringify(arr));}catch(e){}
}
function ttAddTimeSlot(){
  const v=prompt('추가할 시간대를 입력하세요 (예: 1:00-3:00)');
  if(v===null)return;
  const t=v.trim();if(!t)return;
  const arr=getPinnedTimes();
  if(!arr.includes(t))arr.push(t);
  savePinnedTimes(arr);
  T(t+' 시간대 추가됨');
  rHome();
}
function ttEditTimeSlot(oldTime){
  const nv=prompt('시간대 수정 (완전히 비우고 확인을 누르면 이 시간대를 목록에서 제거합니다)',oldTime);
  if(nv===null)return;
  const arr=getPinnedTimes();
  const idx=arr.indexOf(oldTime);
  const nt=nv.trim();
  if(!nt){
    if(idx>=0){arr.splice(idx,1);savePinnedTimes(arr);T('시간대 삭제됨');}
    else T('학생이 배정된 시간대는 학생을 모두 옮긴 뒤 삭제할 수 있어요');
  } else {
    if(idx>=0)arr[idx]=nt;else arr.push(nt);
    savePinnedTimes(arr);
    T('시간대 수정됨');
  }
  rHome();
}

function setAtt(sid,date,val){const s=gs(sid);if(!s)return;if(!s.attendance)s.attendance={};if(s.attendance[date]===val)delete s.attendance[date];else s.attendance[date]=val;if(!['X','지각','조퇴'].includes(s.attendance[date]))if(s.reasons)delete s.reasons[date];T(s.name+'→'+(s.attendance[date]||'초기화'));saveData();rToday();}

function setMakeup(sid,d,v){const s=gs(sid);if(!s.makeups)s.makeups={};if(v)s.makeups[d]=v;else delete s.makeups[d];saveData();}

function changeMakeupTimeHome(sid,date){
  const s=gs(sid);if(!s)return;
  const dt=ld(date);
  const m=dt.getMonth()+1,day=dt.getDate();
  // 이 날짜에 해당하는 makeup 키 찾기
  const mkKey=Object.keys(s.makeups||{}).find(k=>{
    const v=s.makeups[k];
    return v&&(v.includes(m+'/'+day)||v.includes(String(m).padStart(2,'0')+'/'+String(day).padStart(2,'0')));
  });
  if(!mkKey)return;
  const curVal=s.makeups[mkKey];
  const timeMatch=curVal.match(/(\d{1,2}:\d{2}-\d{1,2}:\d{2})/);
  const curTime=timeMatch?timeMatch[1]:'';
  const newTime=prompt('보강 시간 입력 (예: 4:30-6:30)\n현재: '+(curTime||'미설정'),curTime);
  if(newTime===null)return;
  // 기존 값에서 시간 부분만 교체
  if(newTime){
    if(timeMatch){
      s.makeups[mkKey]=curVal.replace(timeMatch[1],newTime);
    } else {
      s.makeups[mkKey]=curVal+' '+newTime;
    }
    T(s.name+' 보강 시간: '+newTime);
  } else {
    // 시간 제거
    s.makeups[mkKey]=curVal.replace(/\s*\d{1,2}:\d{2}-\d{1,2}:\d{2}/,'').trim();
    T('보강 시간 제거됨');
  }
  saveData();rHome();
}

function toggleNo(sid,type,date){const s=gs(sid);if(!s)return;const key=type==='daily'?'noDaily':'noWeekly';if(!s[key])s[key]={};s[key][date]=!s[key][date];if(!s[key][date])delete s[key][date];saveData();rToday();}
function parseTodoDate(text,base){const m=text.match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;return ds(new Date(ld(base).getFullYear(),+m[1]-1,+m[2]));}
function addTodo(bd){const inp=document.getElementById('td-i');const text=inp.value.trim();if(!text)return;const dd=parseTodoDate(text,bd);todos.push({text,done:false,dueDate:dd,created:bd});inp.value='';if(dd)events.push({date:dd,title:'📋 '+(text.length>12?text.slice(0,12)+'…':text),time:'',memo:text,color:'#7C3AED'});saveData();const l=document.getElementById('td-list');if(l)l.innerHTML=rTodos(bd);const c=document.getElementById('td-cnt');if(c)c.textContent=todos.filter(t=>t.done).length+'/'+todos.length+' 완료';}
function rTodos(bd){if(!todos.length)return'<div style="font-size:12px;color:#7A9E8E;text-align:center;padding:7px 0">할 일을 추가해보세요</div>';return todos.map((t,i)=>{let meta='';if(t.dueDate&&!t.done){const diff=Math.ceil((ld(t.dueDate)-ld(bd))/864e5);meta=diff<0?'<span style="color:#C0392B;font-size:10px;font-weight:500">D+'+Math.abs(diff)+'초과</span>':diff===0?'<span style="color:#D97706;font-size:10px;font-weight:500">D-day</span>':diff<=3?'<span style="color:#1B6B46;font-size:10px;font-weight:500">D-'+diff+'</span>':'<span style="color:#7A9E8E;font-size:10px">D-'+diff+'</span>';}return'<div class="ti2'+(t.done?' dn2':'')+'"><input type="checkbox" style="width:15px;height:15px;cursor:pointer;accent-color:var(--acc);flex-shrink:0" '+(t.done?'checked':'')+' onchange="togTodo('+i+',\''+bd+'\')"><span class="tt">'+t.text+'</span>'+(meta?'<span class="td-m">'+meta+'</span>':'')+'<button class="td-x" onclick="delTodo('+i+',\''+bd+'\')">✕</button></div>';}).join('');}
function togTodo(i,bd){todos[i].done=!todos[i].done;saveData();const l=document.getElementById('td-list');if(l)l.innerHTML=rTodos(bd);const c=document.getElementById('td-cnt');if(c)c.textContent=todos.filter(t=>t.done).length+'/'+todos.length+' 완료';}
function delTodo(i,bd){todos.splice(i,1);saveData();const l=document.getElementById('td-list');if(l)l.innerHTML=rTodos(bd);const c=document.getElementById('td-cnt');if(c)c.textContent=todos.filter(t=>t.done).length+'/'+todos.length+' 완료';}

/* 달력 */
function rCal(){document.getElementById('tp-t').textContent='달력 / 스케줄';document.getElementById('tp-a').innerHTML='<button class="btn p" onclick="openEvt(null)">+ 일정 추가</button>';bCal();}
function bCal(){
  const td=today();if(!calSel)calSel=td;
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),sdow=first.getDay();
  const days=[];for(let i=0;i<sdow;i++)days.push({d:new Date(calY,calM,1-sdow+i),cur:false});for(let i=1;i<=last.getDate();i++)days.push({d:new Date(calY,calM,i),cur:true});while(days.length%7!==0){const nd=new Date(days[days.length-1].d);nd.setDate(nd.getDate()+1);days.push({d:nd,cur:false});}
  const selEvts=events.filter(e=>e.date===calSel),selD=ld(calSel);
  let html='<div class="cal-o"><div><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px"><div style="display:flex;gap:5px;align-items:center"><button class="btn s" onclick="calM--;if(calM<0){calM=11;calY--;}bCal()">◀</button><span style="font-size:14px;font-weight:500;min-width:96px;text-align:center">'+calY+'년 '+(calM+1)+'월</span><button class="btn s" onclick="calM++;if(calM>11){calM=0;calY++;}bCal()">▶</button></div><button class="btn s" onclick="calY=new Date().getFullYear();calM=new Date().getMonth();calSel=today();bCal()">오늘</button></div>';
  html+='<div class="cg">'+['일','월','화','수','목','금','토'].map(d=>'<div class="cdow">'+d+'</div>').join('');
  days.forEach(({d,cur})=>{const dstr=ds(d),isT=dstr===td,isSel=dstr===calSel,dow=d.getDay();const ns=cur?(dow===0?'color:#EF4444':dow===6?'color:#3B82F6':''):'';const evts=events.filter(e=>e.date===dstr);html+='<div class="cd'+(cur?'':' ot')+(isT?' tdy':'')+(isSel?' sl':'')+'" onclick="calSel=\''+dstr+'\';bCal()"><div class="cdn" style="'+ns+'">'+d.getDate()+'</div><div class="cd-ev">'+evts.slice(0,3).map(e=>'<span style="background:'+e.color+'22;color:'+e.color+'">'+e.title+'</span>').join('')+'</div></div>';});
  html+='</div></div><div class="cs"><div class="cs-hd">'+(selD.getMonth()+1)+'월 '+selD.getDate()+'일 ('+DOW[selD.getDay()]+')</div>';
  if(!selEvts.length)html+='<div style="font-size:12px;color:#7A9E8E;text-align:center;padding:12px 0">일정 없음</div>';
  else selEvts.forEach(e=>{const idx=events.indexOf(e);html+='<div class="er"><div class="ed" style="background:'+e.color+'"></div><div class="eb"><div>'+e.title+'</div>'+(e.time?'<div style="font-size:10px;color:#94A3B8">'+e.time+'</div>':'')+(e.memo?'<div style="font-size:10px;color:#94A3B8">'+e.memo+'</div>':'')+'</div><button class="btn s d" onclick="delEvt('+idx+')">삭제</button></div>';});
  html+='<button class="btn p" style="width:100%;margin-top:8px;font-size:12px" onclick="openEvt(\''+calSel+'\')">+ 이 날 추가</button></div></div>';
  document.getElementById('mc').innerHTML=html;
}
function delEvt(idx){events.splice(idx,1);saveData();T('삭제됨');bCal();}
function openEvt(date){
  const ov=document.createElement('div');ov.className='mo';
  const cbtns=ECOLS.map((c,i)=>'<button onclick="document.getElementById(\'ec\').value=\''+c+'\';document.querySelectorAll(\'.cb2\').forEach(b=>b.style.outline=\'none\');this.style.outline=\'2px solid #1e293b\'" class="cb2" style="width:21px;height:21px;border-radius:50%;background:'+c+';border:none;cursor:pointer;outline:'+(i===0?'2px solid #1e293b':'none')+'"></button>').join('');
  ov.innerHTML='<div class="md"><h3>일정 추가</h3><div class="fl" style="margin-bottom:9px"><label>날짜</label><input type="date" id="ed" value="'+(date||today())+'"></div><div class="fl" style="margin-bottom:9px"><label>제목 *</label><input id="et"></div><div class="fl" style="margin-bottom:9px"><label>시간</label><input id="eti" placeholder="14:00"></div><div class="fl" style="margin-bottom:9px"><label>메모</label><textarea id="em" rows="2"></textarea></div><div style="margin-bottom:9px"><div style="font-size:11px;color:#5A8070;font-weight:500;margin-bottom:5px">색상</div><div style="display:flex;gap:5px;flex-wrap:wrap">'+cbtns+'</div><input type="hidden" id="ec" value="'+ECOLS[0]+'"></div><div class="md-b"><button class="btn" onclick="this.closest(\'.mo\').remove()">취소</button><button class="btn p" onclick="addEvt()">추가</button></div></div>';
  document.body.appendChild(ov);
}
function addEvt(){const title=document.getElementById('et').value.trim(),date=document.getElementById('ed').value;if(!title||!date){T('날짜와 제목을 입력하세요');return;}events.push({date,title,time:document.getElementById('eti').value,memo:document.getElementById('em').value,color:document.getElementById('ec').value});document.querySelector('.mo')?.remove();calSel=date;saveData();T('일정 추가됨');bCal();}

/* 출석부 */
function rAtt(){
  if(window._attY===undefined){window._attY=new Date().getFullYear();window._attM=new Date().getMonth();}
  if(window._attTab===undefined)window._attTab='monthly';
  document.getElementById('tp-t').textContent='출석부';
  document.getElementById('tp-a').innerHTML='<button class="btn s p" onclick="exportAtt()">엑셀 다운로드</button>';
  const vY=window._attY,vM=window._attM,tab=window._attTab;

  // 탭 UI
  let html='<div class="tr2" style="margin-bottom:12px">';
  [{v:'monthly',l:'📋 월별 출석부'},{v:'grade',l:'🎓 학년별'},{v:'school',l:'🏫 학교별'}].forEach(({v,l})=>{
    html+=`<button class="tb2${tab===v?' on':''}" onclick="window._attTab='${v}';rAtt()">${l}</button>`;
  });
  html+='</div>';

  // ── 탭 1: 월별 출석부 (기존) ──
  if(tab==='monthly'){
    const rows=students.filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(s=>{
      const stuDays=getStuDays(s),att=s.attendance||{},reasons=s.reasons||{},makeups=s.makeups||{};
      const dim=new Date(vY,vM+1,0).getDate(),classDates=[];
      for(let d=1;d<=dim;d++){const date=vY+'-'+String(vM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(stuDays.includes(new Date(vY,vM,d).getDay()))classDates.push(date);}
      const attended=classDates.filter(d=>att[d]==='O'),absent=classDates.filter(d=>att[d]==='X'),late=classDates.filter(d=>att[d]==='지각'||att[d]==='조퇴');
      return{s,classDates,attended,absent,late,att,reasons,makeups};
    });
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:13px"><button class="btn" onclick="window._attM=(window._attM-1+12)%12;if(window._attM===11)window._attY--;rAtt()">◀</button><span style="font-size:15px;font-weight:500;min-width:78px;text-align:center">'+vY+'년 '+(vM+1)+'월</span><button class="btn" onclick="window._attM=(window._attM+1)%12;if(window._attM===0)window._attY++;rAtt()">▶</button><button class="pill" onclick="window._attY=new Date().getFullYear();window._attM=new Date().getMonth();rAtt()">이번달</button></div>';
    html+='<div class="card"><div style="font-size:13px;font-weight:500;margin-bottom:11px">'+(vM+1)+'월 출석부</div><div style="overflow-x:auto"><table><thead><tr><th>학생</th><th>수업일정</th><th style="text-align:center">출석</th><th style="text-align:center">결석</th><th style="text-align:center">지각/조퇴</th><th>출석일</th><th>결석일(사유) / 보강일</th></tr></thead><tbody>';
    rows.forEach(({s,classDates,attended,absent,late,att,reasons,makeups})=>{
      const attStr=attended.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate();}).join(', ')||'-';
      const absStr=absent.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+(reasons[d]?'('+reasons[d]+')':'');}).join(', ')||'-';
      const lateStr=late.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+' '+(att[d]==='지각'?'지각':'조퇴')+(reasons[d]?'('+reasons[d]+')':'');}).join(', ')||'';
      const mkStr=Object.entries(makeups).filter(([d,v])=>classDates.includes(d)&&v).map(([d,v])=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+'→'+v;}).join(', ');
      html+='<tr><td><button class="lb" onclick="selStu2('+s.id+')">'+s.name+'</button></td><td style="font-size:11px;color:#5A8070">'+getStuLabel(s)+'</td><td style="text-align:center;color:#0D6B3A;font-weight:500">'+attended.length+'</td><td style="text-align:center;color:#922B21;font-weight:500">'+absent.length+'</td><td style="text-align:center;color:#7D5A00;font-weight:500">'+(late.length||'-')+'</td><td style="font-size:12px;color:#2D5044;max-width:200px">'+attStr+'</td><td style="font-size:12px;max-width:180px">'+(absStr!=='-'?'<div style="color:#94A3B8">'+absStr+'</div>':'')+(lateStr?'<div style="color:#8A6500">'+lateStr+'</div>':'')+(mkStr?'<div style="color:#1B6B46;font-size:11px">보강: '+mkStr+'</div>':'')+(absStr==='-'&&!lateStr&&!mkStr?'-':'')+'</td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  // ── 탭 2: 학년별 ──
  else if(tab==='grade'){
    const active=students.filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    // 학년 추출 및 그룹화
    const gradeMap={};
    active.forEach(s=>{
      const g=s.grade||'학년 미입력';
      if(!gradeMap[g])gradeMap[g]=[];
      gradeMap[g].push(s);
    });
    const grades=Object.keys(gradeMap).sort((a,b)=>{
      // 숫자 포함 학년 정렬: 중1, 중2, 중3, 고1...
      const order={'중1':1,'중2':2,'중3':3,'고1':4,'고2':5,'고3':6,'1학년':1,'2학년':2,'3학년':3};
      return (order[a]||99)-(order[b]||99)||a.localeCompare(b,'ko');
    });
    if(!grades.length){html+='<div class="card" style="color:#7A9E8E;text-align:center;padding:28px">학생 정보가 없습니다</div>';}

      grades.forEach(grade=>{
        const stus=gradeMap[grade];
        html+=`<div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">

            <span style="font-size:12px;color:#7A9E8E">${stus.length}명</span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px">`;
        stus.forEach(s=>{
          html+=`<div style="border:1px solid #D4EDE0;border-radius:var(--rs);padding:10px 12px;background:#F5FCF7">
            <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px">
              <div style="width:26px;height:26px;border-radius:50%;background:#C8EDD8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1B5E3B">${s.name[0]}</div>
              <button class="lb" style="font-size:13px;font-weight:600" onclick="selStu2(${s.id})">${s.name}</button>
            </div>
            <div style="font-size:11px;color:#7A9E8E">${s.school||'-'}</div>
            <div style="font-size:11px;color:#7A9E8E">${getStuLabel(s)}</div>
            ${s.momPhone?`<div style="font-size:11px;color:#5A8070;margin-top:3px">📞 ${s.momPhone}</div>`:''}
          </div>`;
        });
        html+='</div></div>';
      });
    }
  }

  // ── 탭 3: 학교별 ──
  else if(tab==='school'){
    const active=students.filter(s=>s.active!==false).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    const schoolMap={};
    active.forEach(s=>{
      const sc=s.school||'학교 미입력';
      if(!schoolMap[sc])schoolMap[sc]=[];
      schoolMap[sc].push(s);
    });
    const schools=Object.keys(schoolMap).sort((a,b)=>a.localeCompare(b,'ko'));
    if(!schools.length){html+='<div class="card" style="color:#7A9E8E;text-align:center;padding:28px">학생 정보가 없습니다</div>';}
    else{
      schools.forEach(school=>{
        const stus=schoolMap[school];
        // 학교 내 학년 정렬
        stus.sort((a,b)=>{
          const order={'중1':1,'중2':2,'중3':3,'고1':4,'고2':5,'고3':6};
          return ((order[a.grade]||99)-(order[b.grade]||99))||a.name.localeCompare(b.name,'ko');
        });
        html+=`<div class="card" style="margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
            <div style="background:#E0F5EB;color:#0D5C3A;font-size:13px;font-weight:700;padding:4px 14px;border-radius:20px">🏫 ${school}</div>
            <span style="font-size:12px;color:#7A9E8E">${stus.length}명</span>
          </div>
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead><tr>

function exportAtt(){
  const vY=window._attY||new Date().getFullYear(),vM=window._attM!=null?window._attM:new Date().getMonth();
  let csv='\uFEFF학생,수업일정,출석,결석,지각/조퇴,출석률,출석일,결석일(사유),보강일\n';
  students.filter(s=>s.active!==false).forEach(s=>{
    const stuDays=getStuDays(s),att=s.attendance||{},reasons=s.reasons||{},makeups=s.makeups||{};
    const dim=new Date(vY,vM+1,0).getDate(),classDates=[];
    for(let d=1;d<=dim;d++){const date=vY+'-'+String(vM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');if(stuDays.includes(new Date(vY,vM,d).getDay()))classDates.push(date);}
    const attended=classDates.filter(d=>att[d]==='O'),absent=classDates.filter(d=>att[d]==='X'),late=classDates.filter(d=>att[d]==='지각'||att[d]==='조퇴');
    const total=classDates.length,rate=total?Math.round(attended.length/total*100)+'%':'-';
    csv+='"'+s.name+'","'+getStuLabel(s)+'","'+attended.length+'","'+absent.length+'","'+late.length+'","'+rate+'","'+attended.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate();}).join(' ')+'","'+absent.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+(reasons[d]?'('+reasons[d]+')':'');}).join(' ')+'","'+Object.entries(makeups).filter(([d,v])=>classDates.includes(d)&&v).map(([d,v])=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+'→'+v;}).join(' ')+'"\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='출석부_'+vY+'년_'+(vM+1)+'월.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);T((vM+1)+'월 출석부 다운로드됨!');
}

function buildFB(s,dateStr,book,hw,note,dScore,wScore){
  const lines=[];
  const name=s.name;
  lines.push(name+' 학생 피드백 문자 드립니다.');
  lines.push('');
  // 이번주 수업 날짜 계산
  const _vd=dateStr.match(/\d{1,2}\/\d{1,2}/)?dateStr.split('(')[0].trim():'';
  const _dow=ld(vDate||today()).getDay();
  const _weekStart=new Date(ld(vDate||today()));_weekStart.setDate(_weekStart.getDate()-(_dow||7)+1);
  const _stuDays=getStuDays(s);
  const _thisWeekClasses=[];
  for(let i=0;i<7;i++){
    const _d=new Date(_weekStart);_d.setDate(_d.getDate()+i);
    const _dayOfWeek=_d.getDay();
    if(_stuDays.includes(_dayOfWeek)){
      const _mm=_d.getMonth()+1, _dd=_d.getDate();
      _thisWeekClasses.push(_mm+'월 '+_dd+'일('+['일','월','화','수','목','금','토'][_dayOfWeek]+')');
    }
  }
  lines.push('수업일 | '+(_thisWeekClasses.length?_thisWeekClasses.join(', '):'정보없음'));
  lines.push('');
  lines.push('교재 | '+(book||''));
  lines.push('');
  // 일일TEST - 입력값 있을 때만 표시
  if(dScore==='없음'){lines.push('일일TEST | X');}
  else if(dScore&&(dScore.correct!=null&&dScore.correct!==''||dScore.total!=null&&dScore.total!=='')){
    const c=dScore.correct!=null&&dScore.correct!==''?dScore.correct:'';
    const t=dScore.total!=null&&dScore.total!==''?dScore.total:'';
    lines.push('일일TEST | '+c+(t?'/'+t:''));
  }
  // 주간TEST - 입력값 있을 때만 표시
  if(wScore==='없음'){lines.push('주간TEST | X');}
  else if(wScore&&(wScore.correct!=null&&wScore.correct!==''||wScore.total!=null&&wScore.total!=='')){
    const c=wScore.correct!=null&&wScore.correct!==''?wScore.correct:'';
    const t=wScore.total!=null&&wScore.total!==''?wScore.total:'';
    lines.push('주간TEST | '+c+(t?'/'+t:''));
  }
  lines.push('');
  lines.push('특이사항 | '+(note||''));
  lines.push('');
  lines.push('감사합니다 :)');
  return lines.join('\n');
}

function toggleFBNo(sid,type){
  const s=gs(sid);if(!s)return;
  const dateVal=vDate||today();
  const key=type==='daily'?'noDaily':'noWeekly';
  if(!s[key])s[key]={};
  s[key][dateVal]=!s[key][dateVal];
  if(!s[key][dateVal])delete s[key][dateVal];
  saveData();rFB();
}
function updFBCard(sid){
  const s=gs(sid);if(!s)return;
  const dateVal=vDate||today();
  const tdo=ld(dateVal);
  const dateStr=(tdo.getMonth()+1)+'월 '+tdo.getDate()+'일 ('+['일','월','화','수','목','금','토'][tdo.getDay()]+')';
  const book=document.getElementById('fb-b-'+sid)?.value||'';
  const hw=document.getElementById('fb-hw-'+sid)?.value||'';
  const note=document.getElementById('fb-n-'+sid)?.value||'';
  const dc=document.getElementById('fb-dc-'+sid)?.value,dt=document.getElementById('fb-dt-'+sid)?.value;
  const wc=document.getElementById('fb-wc-'+sid)?.value,wt=document.getElementById('fb-wt-'+sid)?.value;
  const noD=(s.noDaily||{})[dateVal],noW=(s.noWeekly||{})[dateVal];
  const dScore=noD?'없음':(dc||dt)?{correct:dc,total:dt}:null;
  const wScore=noW?'없음':(wc||wt)?{correct:wc,total:wt}:null;
  const prev=document.getElementById('fb-prev-'+sid);
  if(prev)prev.textContent=buildFB(gs(sid),dateStr,book,hw,note,dScore,wScore);
  
  // 입력할 때마다 자동 저장
  if(!s.fbNotes)s.fbNotes={};
  if(note)s.fbNotes[dateVal]=note;else delete s.fbNotes[dateVal];
  if(!s.feedbackHistory)s.feedbackHistory=[];
  const entry={date:dateVal,text:prev?.textContent||'',hw:hw,book:book,note:note};
  const ei=s.feedbackHistory.findIndex(f=>f.date===dateVal);
  if(ei!==-1)s.feedbackHistory[ei]=entry;else s.feedbackHistory.unshift(entry);
  saveData();
}
function copyFBCard(sid){
  const prev=document.getElementById('fb-prev-'+sid);if(!prev)return;
  navigator.clipboard.writeText(prev.textContent).then(()=>T(gs(sid)?.name+' 복사됨!')).catch(()=>{const ta=document.createElement('textarea');ta.value=prev.textContent;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);T('복사됨!');});
}
function saveFBCard(sid){
  const s=gs(sid);if(!s)return;
  const prev=document.getElementById('fb-prev-'+sid);if(!prev)return;
  if(!s.feedbackHistory)s.feedbackHistory=[];
  const dateVal=vDate||today();
  const hw=document.getElementById('fb-hw-'+sid)?.value||'';
  const book=document.getElementById('fb-b-'+sid)?.value||'';
  const note=document.getElementById('fb-n-'+sid)?.value||'';
  if(!s.fbNotes)s.fbNotes={};
  if(note)s.fbNotes[dateVal]=note;else delete s.fbNotes[dateVal];
  const entry={date:dateVal,text:prev.textContent,hw:hw,book:book,note:note};
  // 같은 날짜 덮어쓰기
  const ei=s.feedbackHistory.findIndex(f=>f.date===dateVal);
  if(ei!==-1)s.feedbackHistory[ei]=entry;else s.feedbackHistory.unshift(entry);
  saveData();T(s.name+' 피드백 저장됨! ✓');
  const _sb=document.querySelector('[onclick="saveFBCard('+sid+')"]');
  if(_sb){_sb.textContent='✓ 저장됨';setTimeout(function(){if(_sb)_sb.textContent='저장';},1500);}
}

function graphT(s){
  // 데이터 준비: 일일/주간 점수를 날짜순 정렬, 퍼센트로 변환
  function toPct(t){if(t.correct==null||t.total==null||t.total===0||t.total==='')return null;return Math.round(+t.correct/+t.total*100);}
  const daily=[...s.dailyTests].filter(t=>toPct(t)!==null).sort((a,b)=>a.date>b.date?1:-1);
  const weekly=[...s.weeklyTests].filter(t=>toPct(t)!==null).sort((a,b)=>a.date>b.date?1:-1);
  // 최근 20개
  const dData=daily.slice(-20).map(t=>({date:t.date,pct:toPct(t)}));
  const wData=weekly.slice(-20).map(t=>({date:t.date,pct:toPct(t)}));
  
  function mkSvg(data,color,bgColor,label){
    if(!data.length)return'<div style="color:#7A9E8E;font-size:13px;text-align:center;padding:24px 0">데이터 없음</div>';
    const W=540,H=180,PL=36,PR=16,PT=18,PB=38;
    const cW=W-PL-PR,cH=H-PT-PB;
    const n=data.length;
    const minV=Math.max(0,Math.min(...data.map(d=>d.pct))-10);
    const maxV=Math.min(100,Math.max(...data.map(d=>d.pct))+5);
    const range=maxV-minV||10;
    function xPos(i){return PL+i/(Math.max(n-1,1))*cW;}
    function yPos(v){return PT+cH*(1-(v-minV)/range);}
    // 그리드 라인
    let svg='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:'+W+'px;display:block">';
    // 배경
    svg+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="'+bgColor+'" rx="8"/>';
    // 그리드
    [0,25,50,75,100].forEach(v=>{
      const vy=yPos(v);
      if(vy<PT-2||vy>PT+cH+2)return;
      svg+='<line x1="'+PL+'" y1="'+vy+'" x2="'+(W-PR)+'" y2="'+vy+'" stroke="#D4EDE0" stroke-width="1" stroke-dasharray="3,3"/>';
      svg+='<text x="'+(PL-5)+'" y="'+(vy+3)+'" text-anchor="end" font-size="9" fill="#94A3B8">'+v+'%</text>';
    });
    if(n>=2){
      // 채움 영역
      let pts=data.map((d,i)=>xPos(i)+','+yPos(d.pct)).join(' ');
      let areaPath='M '+xPos(0)+','+yPos(data[0].pct)+' ';
      data.forEach((d,i)=>{if(i>0)areaPath+='L '+xPos(i)+','+yPos(d.pct)+' ';});
      areaPath+='L '+xPos(n-1)+','+(PT+cH)+' L '+xPos(0)+','+(PT+cH)+' Z';
      svg+='<path d="'+areaPath+'" fill="'+color+'" fill-opacity="0.12"/>';
      // 라인
      let linePath='M '+xPos(0)+','+yPos(data[0].pct);
      data.forEach((d,i)=>{if(i>0)linePath+=' L '+xPos(i)+','+yPos(d.pct);});
      svg+='<path d="'+linePath+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    // 포인트 + 레이블
    data.forEach((d,i)=>{
      const cx=xPos(i),cy=yPos(d.pct);
      svg+='<circle cx="'+cx+'" cy="'+cy+'" r="4.5" fill="'+color+'" stroke="#fff" stroke-width="2"/>';
      // 점수 레이블 (위/아래 번갈아)
      const above=i%2===0;
      svg+='<text x="'+cx+'" y="'+(cy+(above?-8:16))+'" text-anchor="middle" font-size="10" font-weight="600" fill="'+color+'">'+d.pct+'%</text>';
      // X축 날짜
      const dt=ld(d.date);const dateLabel=(dt.getMonth()+1)+'/'+(dt.getDate());
      if(n<=10||i%(Math.ceil(n/10))===0||i===n-1)
        svg+='<text x="'+cx+'" y="'+(PT+cH+PB-4)+'" text-anchor="middle" font-size="9" fill="#94A3B8">'+dateLabel+'</text>';
    });
    svg+='</svg>';
    return svg;
  }

  // 평균 계산
  const dAvg=dData.length?Math.round(dData.reduce((a,b)=>a+b.pct,0)/dData.length):null;
  const wAvg=wData.length?Math.round(wData.reduce((a,b)=>a+b.pct,0)/wData.length):null;
  const dTrend=dData.length>=2?dData[dData.length-1].pct-dData[0].pct:null;
  const wTrend=wData.length>=2?wData[wData.length-1].pct-wData[0].pct:null;

  function trendBadge(t){if(t===null)return'';const up=t>0;return'<span style="font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;background:'+(up?'#C8F0DA':'#FDECEA')+';color:'+(up?'#0D5C3A':'#922B21')+'">'+(up?'▲':'▼')+' '+Math.abs(t)+'%p</span>';}

  let h='';
  // 총괄 TEST 점수가 있으면 상단에 표시
  if(s.totalTest&&s.totalTest.score!==''){
    h+='<div class="card" style="background:linear-gradient(135deg,#1B3A2D 0%,#2D9B6A 100%);border:none;margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between"><div><div style="font-size:11px;color:rgba(255,255,255,.6);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">총괄 TEST 점수</div><div style="font-size:36px;font-weight:700;color:#fff">'+s.totalTest.score+'<span style="font-size:16px;color:rgba(255,255,255,.6)">점</span></div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">'+(s.totalTest.date?fmtD(s.totalTest.date):'')+'</div></div><div style="font-size:52px;opacity:.25">🏆</div></div></div>';
  }

  h+='<div class="card" style="margin-bottom:10px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div style="font-size:13px;font-weight:600;color:#1A3028">📈 일일 TEST 추이</div><div style="display:flex;align-items:center;gap:7px">'+(dAvg!==null?'<span style="font-size:12px;color:#5A8070">평균 <strong style="color:#2563EB">'+dAvg+'%</strong></span>':'')+(trendBadge(dTrend))+'</div></div>';
  h+=mkSvg(dData,'#2563EB','#F8FAFC','일일TEST');
  h+='</div>';

  h+='<div class="card"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><div style="font-size:13px;font-weight:600;color:#1A3028">📊 주간 TEST 추이</div><div style="display:flex;align-items:center;gap:7px">'+(wAvg!==null?'<span style="font-size:12px;color:#5A8070">평균 <strong style="color:#7C3AED">'+wAvg+'%</strong></span>':'')+(trendBadge(wTrend))+'</div></div>';
  h+=mkSvg(wData,'#7C3AED','#F8FAFC','주간TEST');
  h+='</div>';

  return h;
}

function reportT(s){
  const now=new Date();
  if(window._repY===undefined){window._repY=now.getFullYear();window._repM=now.getMonth();}
  const vY=window._repY,vM=window._repM;
  const ymLabel=vY+'년 '+(vM+1)+'월';
  const ym=vY+'-'+String(vM+1).padStart(2,'0');

  // 해당 월 수업일 계산
  const stuDays=getStuDays(s),att=s.attendance||{},reasons=s.reasons||{},makeups=s.makeups||{};
  const dim=new Date(vY,vM+1,0).getDate(),classDates=[];
  for(let d=1;d<=dim;d++){
    const date=vY+'-'+String(vM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    if(stuDays.includes(new Date(vY,vM,d).getDay()))classDates.push(date);
  }
  const attended=classDates.filter(d=>att[d]==='O');
  const absent=classDates.filter(d=>att[d]==='X');
  const late=classDates.filter(d=>att[d]==='지각'||att[d]==='조퇴');
  const total=classDates.length;

  // 이달 테스트
  const dTests=s.dailyTests.filter(t=>t.date&&t.date.startsWith(ym)).sort((a,b)=>a.date>b.date?1:-1);
  const wTests=s.weeklyTests.filter(t=>t.date&&t.date.startsWith(ym)).sort((a,b)=>a.date>b.date?1:-1);
  function toPct(t){if(t.correct==null||t.total==null||+t.total===0)return null;return Math.round(+t.correct/+t.total*100);}
  const dAvg=dTests.length?Math.round(dTests.reduce((a,t)=>{const p=toPct(t);return p!=null?a+p:a;},0)/dTests.filter(t=>toPct(t)!=null).length):null;
  const wAvg=wTests.length?Math.round(wTests.reduce((a,t)=>{const p=toPct(t);return p!=null?a+p:a;},0)/wTests.filter(t=>toPct(t)!=null).length):null;

  // 이달 주말클리닉
  const wcs=(s.weekendClinic||[]).filter(w=>w.date&&w.date.startsWith(ym));

  // 현재 교재
  const curTB=(s.textbooks||[]).filter(tb=>!tb.done).map(tb=>tb.name).join(', ')||'-';

  // 성적표 미리보기 텍스트 생성
  function buildReport(){
    const lines=[];
    lines.push('━━━━━━━━━━━━━━━━━━━');
    lines.push('📚 '+s.name+' 학생 '+ymLabel+' 학습 결과');
    lines.push('━━━━━━━━━━━━━━━━━━━');
    lines.push('');
    lines.push('📖 진행 교재: '+curTB);
    lines.push('');
    lines.push('【 출결 현황 】');
    lines.push('· 총 수업일: '+total+'일');
    lines.push('· 출석: '+attended.length+'일  결석: '+absent.length+'일'+(late.length?'  지각/조퇴: '+late.length+'일':''));
    if(absent.length){
      const absDetail=absent.map(d=>{const o=ld(d);const mk=makeups[d]?'(보강: '+makeups[d]+')':'(미보강)';return (o.getMonth()+1)+'/'+o.getDate()+mk;}).join(', ');
      lines.push('· 결석일: '+absDetail);
    }
    if(late.length){
      const lateDetail=late.map(d=>{const o=ld(d);return(o.getMonth()+1)+'/'+o.getDate()+' '+(att[d]==='지각'?'지각':'조퇴')+(reasons[d]?'('+reasons[d]+')':'');}).join(', ');
      lines.push('· 지각/조퇴: '+lateDetail);
    }
    if(wcs.length){
      lines.push('');
      lines.push('【 주말 클리닉 】');
      wcs.forEach(w=>lines.push('· '+w.date+(w.time?' '+w.time:'')+(w.memo?' — '+w.memo:'')));
    }
    lines.push('');
    lines.push('【 테스트 결과 】');
    if(dTests.length){
      lines.push('· 일일 TEST ('+dTests.length+'회)');
      dTests.forEach(t=>{const o=ld(t.date);const pct=toPct(t);lines.push('  '+(o.getMonth()+1)+'/'+o.getDate()+': '+(t.correct!=null?t.correct:'')+(t.total?'/'+t.total:'')+(pct!=null?' ('+pct+'%)':''));});
      if(dAvg!=null)lines.push('  → 평균: '+dAvg+'%');
    } else lines.push('· 일일 TEST: 기록 없음');
    if(wTests.length){
      lines.push('· 주간 TEST ('+wTests.length+'회)');
      wTests.forEach(t=>{const o=ld(t.date);const pct=toPct(t);lines.push('  '+(o.getMonth()+1)+'/'+o.getDate()+': '+(t.correct!=null?t.correct:'')+(t.total?'/'+t.total:'')+(pct!=null?' ('+pct+'%)':''));});
      if(wAvg!=null)lines.push('  → 평균: '+wAvg+'%');
    } else lines.push('· 주간 TEST: 기록 없음');
    if(s.totalTest&&s.totalTest.score!==''){
      lines.push('');
      lines.push('【 총괄 TEST 】');
      lines.push('· 점수: '+s.totalTest.score+'점'+(s.totalTest.date?' ('+fmtD(s.totalTest.date)+')':''));
    }
    lines.push('');
    lines.push('━━━━━━━━━━━━━━━━━━━');
    lines.push('항상 최선을 다해 지도하겠습니다 😊');
    return lines.join('\n');
  }

  const txt=buildReport();

  let h='<div class="card">';
  // 월 선택
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px"><button class="btn" onclick="window._repM=(window._repY==='+vY+'&&window._repM===0)?(window._repY--,11):(window._repM-1);rTab()">◀</button><span style="font-size:14px;font-weight:600;color:#1A3028;min-width:90px;text-align:center">'+ymLabel+'</span><button class="btn" onclick="window._repM=(window._repM===11)?(window._repY++,0):(window._repM+1);rTab()">▶</button><button class="pill" onclick="window._repY=new Date().getFullYear();window._repM=new Date().getMonth();rTab()">이번달</button></div>';
  // 요약 배지
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">';

  function avgOf(arr){const v=arr.map(toPct).filter(x=>x!==null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null;}

/* 학생 출결 탭 */
function stuAttT(s){
  if(window._stuAttY===undefined){window._stuAttY=new Date().getFullYear();window._stuAttM=new Date().getMonth();}
  const vY=window._stuAttY,vM=window._stuAttM;

    const date=vY+'-'+String(vM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');

      });
      h+='</div>';

      h+='<input value="'+r.replace(/"/g,'&quot;')+'" placeholder="사유 입력..." onchange="stuSetReason('+s.id+',\''+date+'\',this.value)" style="flex:1;min-width:100px;padding:4px 7px;font-size:12px;border:1px solid #D4EDE0;border-radius:5px;background:#F5FCF7;color:#2D5044;font-family:var(--font)">';

      h+='</div>';
      h+='</div>';
    });
  }
  h+='</div>';
  return h;
}

function rExam(){
  document.getElementById('tp-t').textContent='내신대비';

  // ── 시험 캘린더 ──
  function buildExamCal(year,month){
    const ym=year+'-'+String(month+1).padStart(2,'0');
    const firstDow=new Date(year,month,1).getDay();
    const lastDate=new Date(year,month+1,0).getDate();
    const td=today();
    let cal='<table style="width:100%;border-collapse:collapse;table-layout:fixed">';
    cal+='<thead><tr>';
    ['일','월','화','수','목','금','토'].forEach((d,i)=>{
      cal+='<th style="padding:4px 0;font-size:10px;color:'+(i===0?'#E74C3C':i===6?'#2980B9':'#5A8070')+';text-align:center;font-weight:500">'+d+'</th>';
    });
    cal+='</tr></thead><tbody>';
    let cells=[];
    for(let i=0;i<firstDow;i++)cells.push(null);
    for(let d=1;d<=lastDate;d++)cells.push(d);
    while(cells.length%7!==0)cells.push(null);
    for(let r=0;r<cells.length/7;r++){
      cal+='<tr>';
      for(let c=0;c<7;c++){
        const day=cells[r*7+c];
        if(!day){cal+='<td style="height:52px;border:1px solid #EAF5EE;background:#FAFAFA"></td>';continue;}
        const dateStr=ym+'-'+String(day).padStart(2,'0');
        const isToday=dateStr===td;
        const exams=EXAM_SCHEDULE.filter(ex=>dateStr>=ex.start&&dateStr<=ex.end);
        const isFirst=ex=>ex.start===dateStr;
        cal+='<td style="height:52px;border:1px solid #EAF5EE;padding:2px 3px;vertical-align:top;background:'+(isToday?'#F0FAF4':'#fff')+'">';
        cal+='<div style="font-size:10px;font-weight:'+(isToday?'700':'400')+';color:'+(isToday?'#2D9B6A':c===0?'#E74C3C':c===6?'#2980B9':'#2D5044')+';margin-bottom:1px">'+day+'</div>';
        exams.forEach(ex=>{
          cal+='<div style="background:'+ex.color+'22;border-left:2px solid '+ex.color+';border-radius:2px;padding:1px 3px;font-size:9px;color:'+ex.color+';font-weight:600;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(isFirst(ex)?ex.school:'▶ '+ex.school)+'</div>';
        });
        cal+='</td>';
      }
      cal+='</tr>';
    }
    cal+='</tbody></table>';
    return cal;
  }

  EXAM_SCHEDULE.forEach(ex=>{
    html+='<div style="display:flex;align-items:center;gap:5px;font-size:12px;color:#2D5044">'
      +'<div style="width:10px;height:10px;border-radius:2px;background:'+ex.color+'22;border-left:3px solid '+ex.color+'"></div>'

      +'<span style="color:#7A9E8E;font-size:11px">'+ex.students.join(', ')+'</span>'
      +'</div>';
  });
  html+='</div>';
  // 6월 + 7월 나란히
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">';
  html+='<div><div style="font-size:12px;font-weight:600;color:#5A8070;margin-bottom:7px;text-align:center">6월</div>'+buildExamCal(2025,5)+'</div>';
  html+='<div><div style="font-size:12px;font-weight:600;color:#5A8070;margin-bottom:7px;text-align:center">7월</div>'+buildExamCal(2025,6)+'</div>';
  html+='</div>';
  // 시험별 상세 리스트
  html+='<div style="margin-top:12px;border-top:1px solid #EAF5EE;padding-top:10px">';
  html+='<div style="font-size:11px;font-weight:600;color:#5A8070;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">상세 일정</div>';
  EXAM_SCHEDULE.forEach(ex=>{
    const sd=ld(ex.start),ed=ld(ex.end);
    const same=ex.start===ex.end;
    const range=same?((sd.getMonth()+1)+'/'+sd.getDate())
      :((sd.getMonth()+1)+'/'+sd.getDate()+' ~ '+(ed.getMonth()+1)+'/'+ed.getDate());
    html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #EAF5EE">'
      +'<div style="width:4px;height:32px;background:'+ex.color+';border-radius:2px;flex-shrink:0"></div>'
      +'<div style="flex:1">'
      +'<div style="font-size:13px;font-weight:600;color:#1A3028">'+ex.school+'</div>'
      +'<div style="font-size:11px;color:'+ex.color+';font-weight:500">'+range+'</div>'
      +'</div>'
      +'<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end">'
      +ex.students.map(n=>{
        const stu=students.find(s=>s.name===n&&s.active!==false);
        return stu?'<button onclick="selStu2('+stu.id+')" style="padding:2px 8px;border-radius:10px;border:1px solid '+ex.color+'44;background:'+ex.color+'15;font-size:11px;color:'+ex.color+';cursor:pointer;font-family:var(--font)">'+n+'</button>':'<span style="padding:2px 8px;border-radius:10px;border:1px dashed #D4EDE0;font-size:11px;color:#94A3B8">'+n+'</span>';

  html+='</div>';
  html+='</div>'; // end 캘린더 card

  if(!data.length){
    html+='<div class="card" style="text-align:center;padding:32px;color:#7A9E8E"><div style="font-size:32px;margin-bottom:10px">📝</div><div style="font-size:14px;font-weight:500;margin-bottom:6px">내신대비 학교를 추가해보세요</div><div style="font-size:12px">학교별 출판사, 시험기간, 시험날짜를 관리할 수 있어요</div><div style="display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap"><button class="btn p" onclick="autoFillExamSchools()">📥 학생 학교에서 자동 추가</button><button class="btn" onclick="addExamSchool()">+ 학교 직접 추가</button></div></div>';
  } else {
    data.forEach((school,si)=>{
      html+=`<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
          <div style="flex:1"><input value="${escHtml(school.name||'')}" placeholder="학교명" style="font-size:15px;font-weight:600;border:none;border-bottom:2px solid #D4EDE0;border-radius:0;padding:4px 0;width:100%;background:transparent;color:#1A3028" onchange="window._examData[${si}].name=this.value;saveExam()"></div>
          <button class="btn s d" onclick="delExamSchool(${si})">삭제</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
          <div class="fl"><label>출판사</label><input value="${escHtml(school.publisher||'')}" placeholder="예) 미래엔, 비상" onchange="window._examData[${si}].publisher=this.value;saveExam()"></div>
          <div class="fl"><label>시험기간</label><input value="${escHtml(school.examPeriod||'')}" placeholder="예) 5/12~5/16" onchange="window._examData[${si}].examPeriod=this.value;saveExam()"></div>
          <div class="fl"><label>수학 시험날짜</label><input type="date" value="${school.mathDate||''}" onchange="window._examData[${si}].mathDate=this.value;saveExam()"></div>
        </div>
        <div class="fl" style="margin-bottom:8px"><label>기록 / 메모</label><textarea rows="3" placeholder="범위, 특이사항, 준비사항 등..." style="width:100%;padding:7px 9px;font-size:13px;border:1px solid #B2D8C4;border-radius:var(--rs);background:#fff;color:#1A3028;font-family:var(--font);resize:vertical" onchange="window._examData[${si}].memo=this.value;saveExam()">${escHtml(school.memo||'')}</textarea></div>
        <div style="border-top:1px solid #EAF5EE;padding-top:10px">
          <div style="font-size:11px;color:#5A8070;font-weight:500;margin-bottom:6px">해당 학교 재원생</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${students.filter(s=>s.active!==false&&(s.school||'').includes(school.name||'')).map(s=>`<button class="lb" onclick="selStu2(${s.id})" style="padding:3px 10px;border:1px solid #D4EDE0;border-radius:20px;font-size:12px;background:#F5FCF7">${s.name} ${s.grade||''}</button>`).join('')||'<span style="font-size:12px;color:#7A9E8E">해당 학교 학생 없음</span>'}
          </div>
        </div>
      </div>`;
    });
  }
  document.getElementById('mc').innerHTML=html;
}

function addExamSchool(){
  if(!window._examData)window._examData=[];
  window._examData.push({name:'',publisher:'',examPeriod:'',mathDate:'',memo:''});
  saveExam();rExam();
}

function autoFillExamSchools(){
  if(!window._examData)window._examData=[];
  // 재원생 중에서 school 필드가 있는 학교들 모두 수집
  const schoolsInUse=new Set();
  students.filter(s=>s.active!==false&&s.school).forEach(s=>{
    schoolsInUse.add(s.school.trim());
  });
  // 이미 등록된 학교는 제외
  const existing=new Set(window._examData.map(d=>(d.name||'').trim()));
  let added=0;
  schoolsInUse.forEach(name=>{
    if(name&&!existing.has(name)){
      window._examData.push({name:name,publisher:'',examPeriod:'',mathDate:'',memo:''});
      added++;
    }
  });
  if(added>0){saveExam();T(added+'개 학교 추가됨');rExam();}
  else{T('새로 추가할 학교가 없어요');}
}

    '김태희':{wc:[{day:'일',time:'19:00-21:00',memo:''}],pmp:[{day:'금',time:'17:40-18:00',memo:''}]},
    '서유현':{wc:[{day:'토',time:'14:00-16:00',memo:''}],pmp:[{day:'월',time:'15:30-16:00',memo:''}]},
    '이제민':{wc:[{day:'토',time:'13:00-15:00',memo:''}],pmp:[{day:'월',time:'20:30-21:00',memo:''},{day:'수',time:'20:30-21:00',memo:''}]},
    '박동훈':{wc:[{day:'일',time:'14:00-16:00',memo:''}],pmp:[{day:'월',time:'17:30-18:00',memo:''},{day:'수',time:'17:30-18:00',memo:''}]}
  };

  students.forEach(function(s){

  });

}

    if(!(s.wcSlots&&s.wcSlots.length)&&s.wcSchedule){
      // 요일 파싱 시도 (예: "토 15:00-17:00")

  var activeDays=DAYS.filter(function(d){return dayMap[d].length>0;});

function getLastClinicSummary(s){
  var lines=[];var now=new Date();var dow=now.getDay();
  var lastSat=new Date(now);lastSat.setDate(now.getDate()-((dow+1)%7+1));
  function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var lk=fmt(lastSat);
  (s.wcSlots||[]).forEach(function(slot,si){var att=(s.wcAtt||{})[lk+'_'+si];lines.push('주말클리닉('+slot.day+(slot.time?' '+slot.time:'')+') | '+(att==='O'?'참여':att==='X'?'불참':'미입력'));});
  (s.pmpSlots||[]).forEach(function(slot,si){var att=(s.pmpAtt||{})[lk+'_'+si];lines.push('PMP('+slot.day+(slot.time?' '+slot.time:'')+') | '+(att==='O'?'참여':att==='X'?'불참':'미입력'));});
  return lines.join('\n');
}

    const ov=document.createElement('div');ov.className='mo';

    const db=document.createElement('div');db.className='md-b';
    const bc=document.createElement('button');bc.className='btn';bc.textContent='취소';bc.onclick=function(){ov.remove();};
    const bs=document.createElement('button');bs.className='btn d';bs.textContent='퇴원 처리';bs.onclick=function(){s.active=false;s.retireDate=document.getElementById('rt-d').value;s.retireReason=document.getElementById('rt-r').value;ov.remove();saveData();T(s.name+' 퇴원 처리됨');rSB();rStu();};

function addStu(){
  const name=document.getElementById('m-n').value.trim();if(!name){T('학생명을 입력하세요');return;}
  const noSched=document.getElementById('m-nosched')?.checked;
  const act=document.querySelector('input[name="m-act"]:checked')?.value!=='inactive';
  const fd=document.getElementById('m-fd')?.value||'';
  const ca=document.getElementById('m-ca')?.value||'';
  let schedules=[];
  if(!noSched){
    const rows=document.querySelectorAll('.m-sched-row');
    rows.forEach(row=>{
      const dv=row.querySelector('.m-dv-s')?.value;
      const tv=row.querySelector('.m-tv-s')?.value;
      if(dv&&tv)schedules.push({days:dv.split(',').map(Number),time:tv});
    });
    if(!schedules.length){T('수업 요일과 시간을 선택하거나 미등록 체크해주세요');return;}
  }
  const s=mkStu(nextId++,name,[],''
    ,document.getElementById('m-sc').value
    ,document.getElementById('m-gr').value
    ,document.getElementById('m-mo').value
    ,document.getElementById('m-st').value,act,fd);
  s.career=ca;
  s.schedules=schedules;
  students.push(s);document.querySelector('.mo')?.remove();saveData();T('학생 추가됨!');selStu2(s.id);
}

/* ═══ 백업 / 복구 ═══ */
function exportBackup(){
  try{
    const data=JSON.stringify({students,events,todos,_exam:window._examData||[]},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const now=new Date();
    const fname='학생관리_백업_'+now.getFullYear()+(now.getMonth()+1).toString().padStart(2,'0')+now.getDate().toString().padStart(2,'0')+'_'+now.getHours().toString().padStart(2,'0')+now.getMinutes().toString().padStart(2,'0')+'.json';
    a.href=url;a.download=fname;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    T('백업 파일 다운로드됨! ✓');
  }catch(e){T('백업 실패: '+e.message);}
}

function importBackup(input){
  const file=input.files[0];if(!file)return;
  if(!confirm('백업 파일로 복구하면 현재 데이터가 덮어씌워집니다.\n계속하시겠어요?')){input.value='';return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const p=JSON.parse(e.target.result);
      if(!p.students){T('올바른 백업 파일이 아닙니다');return;}
      students=p.students||[];events=p.events||[];todos=p.todos||[];
      if(p._exam)window._examData=p._exam;
      if(students.length)nextId=Math.max(...students.map(s=>s.id))+1;
      students.forEach(s=>{
        if(!s.schedules){
          const days=s.slotDays&&s.slotDays.length?s.slotDays.map(Number):(s.slotId&&LEGACY[s.slotId]?LEGACY[s.slotId].days:[]);
          const time=s.slotTime||(s.slotId&&LEGACY[s.slotId]?LEGACY[s.slotId].time:'');
          s.schedules=(days.length||time)?[{days,time}]:[];
        }
      });
      saveData();syncUp();
      rSB();sv('home');
      T('복구 완료! '+students.length+'명 불러옴 ✓');
    }catch(err){T('복구 실패: 파일을 확인해주세요');}
    input.value='';
  };
  reader.readAsText(file);
}

// 토큰 자동 갱신 리스너
sbClient.auth.onAuthStateChange((event,session)=>{
  if(session){
    _accessToken=session.access_token;
    if(event==='TOKEN_REFRESHED')showSync('saved');
  } else {
    _accessToken=null;
  }

async function checkAuth(){
  try{
    const {data:{session}}=await sbClient.auth.getSession();
    if(session){
      _accessToken=session.access_token;
      document.getElementById('login-screen').style.display='none';
      return true;
    }
  }catch(e){console.error(e);}
  return false;
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const errEl=document.getElementById('login-err');
  const btn=document.getElementById('login-btn');
  if(!email||!pw){errEl.textContent='이메일과 비밀번호를 입력하세요';errEl.style.display='block';return;}
  btn.disabled=true;btn.textContent='로그인 중...';errEl.style.display='none';
  try{
    const {data,error}=await sbClient.auth.signInWithPassword({email,password:pw});
    if(error)throw error;
    _accessToken=data.session.access_token;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('login-pw').value='';
    syncDown();
  }catch(e){
    errEl.textContent='로그인 실패: 이메일 또는 비밀번호를 확인하세요';
    errEl.style.display='block';
    btn.disabled=false;btn.textContent='로그인';
  }
}

async function doLogout(){
  if(!confirm('로그아웃 하시겠어요?'))return;
  await sbClient.auth.signOut();
  _accessToken=null;
  location.reload();
}
